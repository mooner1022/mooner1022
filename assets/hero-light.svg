<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-labelledby="t d">
  <title id="t">Minki Moon (문민기) — Backend &amp; Android Developer</title>
  <desc id="d">I build backends and Android apps. Beside the name, a pink dumbo octopus mascot inside four corner brackets.</desc>
  <style>
